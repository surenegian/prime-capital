<!doctype html>
<!-- Document page template (privacy / terms / support). generator.py fills the title, updated date,
     body and footer nav state, and injects the SEO block into <head>.
     Tokens, header and footer are copied from home.html: keep them in sync if either changes. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--SEO-->
<style>
:root{
  --bg:#f7f5f0; --stone:#ecE9e1; --ink:#131313; --muted:#67655f; --hair:rgba(19,19,19,.11); --accent:#1f4d3a;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,sans-serif;
  --ease:cubic-bezier(.32,.72,0,1);
}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{font:16px/1.55 var(--sans);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit}
.wrap{max-width:1160px;margin:0 auto;padding:0 24px;width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:10px}

header{position:sticky;top:0;z-index:20;background:rgba(247,245,240,.96);border-bottom:1px solid var(--hair)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px;letter-spacing:-.01em;text-decoration:none}
.brand img{width:28px;height:28px;border-radius:8px}
.btn{display:inline-flex;align-items:center;min-height:40px;padding:0 18px;border-radius:999px;background:var(--ink);color:#fff;font-weight:600;font-size:14px;text-decoration:none;transition:transform .35s var(--ease),background .3s}
.btn:hover{background:#000}.btn:active{transform:scale(.97)}

main{flex:1}
.doc{max-width:720px;margin:0 auto;padding:40px 24px 96px}
.back{display:inline-flex;align-items:center;gap:8px;min-height:44px;font-size:14px;font-weight:500;color:var(--muted);text-decoration:none;transition:color .25s}
.back:hover{color:var(--ink)}
.back svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
h1{margin-top:16px;font-size:clamp(36px,5.4vw,60px);line-height:1.02;letter-spacing:-.045em;font-weight:600;text-wrap:balance}
.updated{margin-top:14px;font-size:14px;color:var(--muted)}
.rule{height:1px;background:var(--hair);margin:36px 0 8px}

.prose h2{margin:44px 0 12px;font-size:clamp(21px,2.4vw,26px);line-height:1.2;letter-spacing:-.025em;font-weight:600;text-wrap:balance}
.prose p{margin:0 0 16px;font-size:17px;line-height:1.7;color:rgba(19,19,19,.82);text-wrap:pretty}
.prose ul{margin:0 0 16px;padding-left:22px}
.prose li{margin:0 0 10px;font-size:17px;line-height:1.65;color:rgba(19,19,19,.82);padding-left:4px}
.prose li::marker{color:var(--muted)}
.prose strong{font-weight:600;color:var(--ink)}
.prose a{text-decoration:underline;text-decoration-color:rgba(19,19,19,.3);text-underline-offset:3px;transition:text-decoration-color .25s}
.prose a:hover{text-decoration-color:var(--ink)}

footer{border-top:1px solid var(--hair);padding:20px 0 28px;font-size:14px;color:var(--muted)}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
footer a{text-decoration:none;display:inline-flex;min-height:44px;align-items:center;padding:0 10px}
footer a[aria-current="page"]{color:var(--ink);font-weight:600}
footer a:hover{color:var(--ink)}

.rv{opacity:0;transform:translateY(16px);animation:rise .8s var(--ease) forwards}
@keyframes rise{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;animation:none}}
@media (max-width:600px){.doc{padding-top:24px}.prose p,.prose li{font-size:16px}}
</style>
</head>
<body>
<header><div class="wrap">
  <a class="brand" href="{{ROOT}}"><img src="{{ROOT}}assets/img/v1-86ff3b4995f993732fca-9cfdf38b9eba223c.webp" alt="">Prime Capital</a>
  <a class="btn" href="https://apps.apple.com/app/id6792149434">Download</a>
</div></header>

<main>
  <article class="doc">
    <a class="back rv" href="{{ROOT}}"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>Prime Capital</a>
    <h1 class="rv">{{TITLE}}</h1>
    <p class="updated rv">Last updated {{UPDATED}}</p>
    <div class="rule"></div>
    <div class="prose rv">
{{BODY}}
    </div>
  </article>
</main>

<footer><div class="wrap"><span>© 2026 Prime Capital</span>
  <nav aria-label="Legal"><a href="{{ROOT}}privacy/"{{NAV_privacy}}>Privacy</a><a href="{{ROOT}}terms/"{{NAV_terms}}>Terms</a><a href="{{ROOT}}support/"{{NAV_support}}>Support</a></nav></div></footer>
</body>
</html>
